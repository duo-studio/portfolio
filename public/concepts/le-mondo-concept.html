<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Le Mondo Concept</title>
		<link rel="stylesheet" href="./concept-shell.css" />
	</head>
	<body
		style="
			--shell-page: #ffffff;
			--shell-bg-top: #241120;
			--shell-bg: #170b15;
			--shell-glow: rgba(88, 215, 207, 0.18);
			--shell-frame: rgba(35, 17, 31, 0.12);
			--shell-card: #ffffff;
			--shell-fallback: #0f0d0d;
			--shell-meta: #0f0d0d;
		"
	>
		<main
			class="concept-shell"
			data-concept-shell
			data-desktop="./le-mondo-concept--desktop.html"
			data-mobile="./le-mondo-concept--mobile.html"
			data-desktop-width="1440"
			data-mobile-width="375"
			data-mobile-breakpoint="767"
		>
			<div class="concept-meta" aria-hidden="true">
				<div>Imagined concept for Le Mondo by Duo Studio</div>
				<div class="concept-meta__right">Preview only</div>
			</div>
			<section class="concept-stage" data-concept-stage>
				<div class="concept-canvas-wrap">
					<div class="concept-canvas" data-concept-canvas>
						<iframe title="Le Mondo homepage concept" loading="eager" scrolling="no"></iframe>
					</div>
				</div>
			</section>
			<noscript>
				<p class="concept-shell__fallback">
					<a href="./le-mondo-concept.html?view=desktop">Open the desktop concept</a>
					or
					<a href="./le-mondo-concept.html?view=mobile">open the mobile concept</a>.
				</p>
			</noscript>
		</main>
		<script src="./concept-shell.js"></script>
	</body>
</html>
