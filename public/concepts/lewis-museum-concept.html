<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>The Lewis Museum Concept</title>
		<link rel="stylesheet" href="./concept-shell.css" />
	</head>
	<body
		style="
			--shell-page: #f1ece1;
			--shell-bg-top: #221f20;
			--shell-bg: #221f20;
			--shell-glow: rgba(250, 168, 25, 0.24);
			--shell-frame: rgba(34, 31, 32, 0.14);
			--shell-card: #ffffff;
			--shell-fallback: #221f20;
			--shell-meta: #221f20;
		"
	>
		<main
			class="concept-shell"
			data-concept-shell
			data-desktop="./lewis-museum-concept--desktop.html"
			data-mobile="./lewis-museum-concept--mobile.html"
			data-desktop-width="1440"
			data-mobile-width="375"
			data-mobile-breakpoint="767"
		>
			<div class="concept-meta" aria-hidden="true">
				<div>Imagined concept for The Lewis Museum by Duo Studio</div>
				<div class="concept-meta__right">Preview only</div>
			</div>
			<section class="concept-stage" data-concept-stage>
				<div class="concept-canvas-wrap">
					<div class="concept-canvas" data-concept-canvas>
						<iframe title="The Lewis Museum homepage concept" loading="eager" scrolling="no"></iframe>
					</div>
				</div>
			</section>
			<noscript>
				<p class="concept-shell__fallback">
					<a href="./lewis-museum-concept.html?view=desktop">Open the desktop concept</a>
					or
					<a href="./lewis-museum-concept.html?view=mobile">open the mobile concept</a>.
				</p>
			</noscript>
		</main>
		<script src="./concept-shell.js"></script>
	</body>
</html>
