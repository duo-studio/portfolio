<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Atlas Performing Arts Center Concept</title>
		<link rel="stylesheet" href="./concept-shell.css" />
	</head>
	<body
		style="
			--shell-page: #eef0fa;
			--shell-bg-top: #2d3489;
			--shell-bg: #1a1e4f;
			--shell-glow: rgba(33, 248, 248, 0.2);
			--shell-frame: rgba(45, 52, 137, 0.18);
			--shell-card: #ffffff;
			--shell-fallback: #1a1e4f;
			--shell-meta: #1a1e4f;
		"
	>
		<main
			class="concept-shell"
			data-concept-shell
			data-desktop="./atlas-concept--desktop.html"
			data-mobile="./atlas-concept--mobile.html"
			data-desktop-width="1440"
			data-mobile-width="375"
			data-mobile-breakpoint="767"
		>
			<div class="concept-meta" aria-hidden="true">
				<div>Imagined concept for Atlas Performing Arts Center by Duo Studio</div>
				<div class="concept-meta__right">Preview only</div>
			</div>
			<section class="concept-stage" data-concept-stage>
				<div class="concept-canvas-wrap">
					<div class="concept-canvas" data-concept-canvas>
						<iframe title="Atlas Performing Arts Center homepage concept" loading="eager" scrolling="no"></iframe>
					</div>
				</div>
			</section>
			<noscript>
				<p class="concept-shell__fallback">
					<a href="./atlas-concept.html?view=desktop">Open the desktop concept</a>
					or
					<a href="./atlas-concept.html?view=mobile">open the mobile concept</a>.
				</p>
			</noscript>
		</main>
		<script src="./concept-shell.js"></script>
	</body>
</html>
