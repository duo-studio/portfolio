<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Baltimore Museum of Industry Concept</title>
		<link rel="stylesheet" href="./concept-shell.css" />
	</head>
	<body
		style="
			--shell-page: #ffffff;
			--shell-bg-top: #f4efe5;
			--shell-bg: #1b3e70;
			--shell-glow: rgba(241, 94, 55, 0.2);
			--shell-frame: rgba(19, 32, 44, 0.14);
			--shell-card: #ffffff;
			--shell-fallback: #13202c;
			--shell-meta: #13202c;
		"
	>
		<main
			class="concept-shell"
			data-concept-shell
			data-desktop="./bmi-concept--desktop.html"
			data-mobile="./bmi-concept--mobile.html"
			data-desktop-width="1440"
			data-mobile-width="375"
			data-mobile-breakpoint="767"
		>
			<div class="concept-meta" aria-hidden="true">
				<div>Imagined concept for Baltimore Museum of Industry by Duo Studio</div>
				<div class="concept-meta__right">Preview only</div>
			</div>
			<section class="concept-stage" data-concept-stage>
				<div class="concept-canvas-wrap">
					<div class="concept-canvas" data-concept-canvas>
						<iframe title="Baltimore Museum of Industry homepage concept" loading="eager" scrolling="no"></iframe>
					</div>
				</div>
			</section>
			<noscript>
				<p class="concept-shell__fallback">
					<a href="./bmi-concept.html?view=desktop">Open the desktop concept</a>
					or
					<a href="./bmi-concept.html?view=mobile">open the mobile concept</a>.
				</p>
			</noscript>
		</main>
		<script src="./concept-shell.js"></script>
	</body>
</html>
