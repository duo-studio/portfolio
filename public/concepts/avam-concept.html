<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="robots" content="noindex,nofollow" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>American Visionary Art Museum Concept</title>
		<link rel="stylesheet" href="./concept-shell.css" />
	</head>
	<body
		style="
			--shell-page: #fff476;
			--shell-bg-top: #74d8e6;
			--shell-bg: #10142f;
			--shell-glow: rgba(255, 29, 54, 0.28);
			--shell-frame: rgba(16, 20, 47, 0.16);
			--shell-card: #fffdf2;
			--shell-fallback: #10142f;
			--shell-meta: #10142f;
		"
	>
		<main
			class="concept-shell"
			data-concept-shell
			data-desktop="./avam-concept--desktop.html"
			data-mobile="./avam-concept--mobile.html"
			data-desktop-width="1440"
			data-mobile-width="375"
			data-mobile-breakpoint="767"
		>
			<div class="concept-meta" aria-hidden="true">
				<div>Imagined concept for American Visionary Art Museum by Duo Studio</div>
				<div class="concept-meta__right">Preview only</div>
			</div>
			<section class="concept-stage" data-concept-stage>
				<div class="concept-canvas-wrap">
					<div class="concept-canvas" data-concept-canvas>
						<iframe title="American Visionary Art Museum homepage concept" loading="eager" scrolling="no"></iframe>
					</div>
				</div>
			</section>
			<noscript>
				<p class="concept-shell__fallback">
					<a href="./avam-concept.html?view=desktop">Open the desktop concept</a>
					or
					<a href="./avam-concept.html?view=mobile">open the mobile concept</a>.
				</p>
			</noscript>
		</main>
		<script src="./concept-shell.js"></script>
	</body>
</html>
